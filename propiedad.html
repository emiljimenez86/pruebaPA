              <img src="https://flagcdn.com/es.svg" alt="" class="header-lang__flag" width="22" height="16" aria-hidden="true">
              <span class="header-lang__name">Español</span>
            </span>
          </button>
          <div class="header-lang-list oculto" id="header-lang-list" role="listbox" aria-labelledby="header-lang-label">
            <button type="button" class="header-lang-item" role="option" data-lang="es">

            </button>
            <button type="button" class="header-lang-item" role="option" data-lang="en">

            </button>
            <button type="button" class="header-lang-item" role="option" data-lang="pt">
              <img src="https://flagcdn.com/br.svg" alt="" class="header-lang__flag" width="22" height="16" aria-hidden="true">
              <span>Português</span>
            </button>
            <button type="button" class="header-lang-item" role="option" data-lang="ru">
              <img src="https://flagcdn.com/ru.svg" alt="" class="header-lang__flag" width="22" height="16" aria-hidden="true">
              <span>Русский</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

  <main class="main main-detalle" id="detalle-propiedad">
    <!-- Se llena con JS según ?id= -->
    <p class="detalle-cargando" id="detalle-cargando" data-i18n="detalle.cargando">Cargando...</p>
    <div class="detalle-no-encontrado oculto" id="detalle-no-encontrado">
      <p data-i18n="detalle.no_encontrado">No se encontró la propiedad.</p>
      <a href="index.html" class="btn" data-i18n="detalle.volver">Volver al listado</a>
